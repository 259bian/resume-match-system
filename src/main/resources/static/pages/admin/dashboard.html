<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据大屏 - 简历智能匹配系统</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        .stat-card {
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .stat-card:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
<div id="app" class="app-layout">
    <aside class="app-sidebar">
        <div class="sidebar-logo"><h2>ResumeMatch</h2><span>管理后台</span></div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <div class="sidebar-footer">
            <div class="user-info" onclick="location.href='/pages/admin/profile.html'">
                <div class="user-avatar">{{ currentUser?.realName?.[0] || 'A' }}</div>
                <div><div class="user-name">{{ currentUser?.realName || '管理员' }}</div><div class="user-role">系统管理员</div></div>
            </div>
        </div>
    </aside>
    <main class="app-main">
        <header class="app-topbar">
            <div class="topbar-breadcrumb">数据大屏</div>
            <div class="topbar-actions">
                <button class="btn btn-outline btn-sm" onclick="Auth.logout()">退出登录</button>
            </div>
        </header>
        <div class="app-content">
            <!-- Loading -->
            <div class="loading-overlay" v-if="loading"><div class="spinner"></div></div>

            <!-- Stat Cards -->
            <div class="stat-grid">
                <div class="stat-card"
                     v-for="s in stats"
                     :key="s.label"
                     @click="handleCardClick(s.key)">
                    <div class="stat-accent"></div>
                    <div class="stat-icon" :class="s.color">{{ s.icon }}</div>
                    <div>
                        <div class="stat-value">{{ s.value }}</div>
                        <div class="stat-label">{{ s.label }}</div>
                    </div>
                </div>
            </div>

            <!-- Charts Row -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
                <div class="card">
                    <div class="card-header"><h3>投递状态分布</h3></div>
                    <div class="card-body"><div id="pieChart" style="height:320px"></div></div>
                </div>
                <div class="card">
                    <div class="card-header"><h3>岗位分类分布</h3></div>
                    <div class="card-body"><div id="barChart" style="height:320px"></div></div>
                </div>
            </div>

            <!-- Trend Chart -->
            <div class="card">
                <div class="card-header"><h3>近7天投递趋势</h3></div>
                <div class="card-body"><div id="lineChart" style="height:280px"></div></div>
            </div>
        </div>
    </main>
</div>
<!--页面引入vue3-->
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="/js/common.js"></script>
<script>
    <!--创建vue3实例-->
    createVueApp({
        data() {
            return {
                loading: false,//响应式
                stats: [
                    { icon:'👥', color:'blue', label:'用户总数', value:0, key:'totalUsers' },
                    { icon:'📄', color:'green', label:'简历总数', value:0, key:'totalResumes' },
                    { icon:'💼', color:'orange', label:'在招岗位', value:0, key:'totalJobs' },
                    { icon:'📋', color:'purple', label:'投递总数', value:0, key:'totalApplications' },
                    { icon:'📅', color:'cyan', label:'今日投递', value:0, key:'todayApplications' },
                    { icon:'📊', color:'red', label:'成功率', value:'0%', key:'matchSuccessRate' }
                ],//响应式（数组+里面每个对象都是响应式）
                dashboardData: null//响应式
            };
        },
        mounted() {
            const user = initLayout('admin');
            if (!user) return;
            this.loadData();
        },
        methods: {
            //数据加载与发送请求
            async loadData() {
                this.loading = true;
                try {
                    const res = await Api.get('admin/overview');
                    if (res.code === 200) {
                        const d = res.data;
                        this.dashboardData = d;
                        this.stats[0].value = d.totalUsers || 0;
                        this.stats[1].value = d.totalResumes || 0;
                        this.stats[2].value = d.totalJobs || 0;
                        this.stats[3].value = d.totalApplications || 0;
                        this.stats[4].value = d.todayApplications || 0;
                        this.stats[5].value = (d.matchSuccessRate || 0).toFixed(1) + '%';
                        this.$nextTick(() => this.renderCharts(d));
                    }
                } catch (e) {
                    Toast.error('数据加载失败');
                } finally {
                    this.loading = false;
                }
            },
            // 卡片跳转逻辑，卡片点击事件
            handleCardClick(key) {
                switch (key) {
                    case 'totalUsers':
                        // 用户总数 → 用户管理
                        location.href = '/pages/admin/user-manage.html';
                        break;
                    case 'totalResumes':
                        // 简历总数 → 简历管理
                        location.href = '/pages/admin/resume-manage.html';
                        break;
                    case 'totalJobs':
                        // 在招岗位 → 岗位管理
                        location.href = '/pages/admin/job-manage.html';
                        break;
                    case 'totalApplications':
                        // 投递总数 → 投递管理
                        location.href = '/pages/admin/application-manage.html';
                        break;
                    case 'todayApplications':
                        // 投递总数 → 投递管理
                        location.href = '/pages/admin/application-manage.html';
                        break;
                }
            },
            //echarts图表渲染
            renderCharts(d) {
                // 饼图
                const pieDom = document.getElementById('pieChart');
                if (pieDom) {
                    const pie = echarts.init(pieDom);
                    const pieData = d.applicationStatusDistribution
                        ? Object.entries(d.applicationStatusDistribution).map(([name,value]) => ({name,value}))
                        : [];
                    pie.setOption({
                        tooltip:{trigger:'item'},
                        series:[{type:'pie',radius:['45%','70%'],center:['50%','45%'],data:pieData,
                            color:['#f59e0b','#3b82f6','#10b981','#ef4444','#06b6d4']}]
                    });
                    this._pieChart = pie;
                }

                // 柱状图
                const barDom = document.getElementById('barChart');
                if (barDom) {
                    const bar = echarts.init(barDom);
                    const cats = [], vals = [];
                    if (d.jobCategoryDistribution) {
                        Object.entries(d.jobCategoryDistribution).forEach(([k,v]) => { cats.push(k); vals.push(v); });
                    }
                    bar.setOption({
                        tooltip:{trigger:'item'},
                        xAxis:{type:'category',data:cats,axisLabel:{rotate:30,fontSize:11}},
                        yAxis:{type:'value'},
                        series:[{type:'bar',data:vals,barWidth:'40%',borderRadius:[4,4,0,0],
                            itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[
                                    {offset:0,color:'#4f6ef6'},{offset:1,color:'#7c5cfc'}
                                ])}}]
                    });
                    this._barChart = bar;
                }

                // 折线图
                const lineDom = document.getElementById('lineChart');
                if (lineDom) {
                    const line = echarts.init(lineDom);
                    const days = [], counts = [];
                    if (d.dailyApplicationTrend) {
                        Object.entries(d.dailyApplicationTrend).forEach(([k,v]) => { days.push(k); counts.push(v); });
                    }
                    line.setOption({
                        tooltip:{trigger:'axis'},
                        xAxis:{data:days,axisLabel:{fontSize:11}},
                        yAxis:{type:'value'},
                        series:[{name:'投递量',type:'line',smooth:true,data:counts,symbol:'circle',symbolSize:6,
                            lineStyle:{width:3,color:'#4f6ef6'},
                            itemStyle:{color:'#4f6ef6'},
                            areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[
                                    {offset:0,color:'rgba(79,110,246,.25)'},{offset:1,color:'rgba(79,110,246,.02)'}
                                ])}}]
                    });
                    this._lineChart = line;
                }

                window.addEventListener('resize', () => {
                    this._pieChart?.resize(); this._barChart?.resize(); this._lineChart?.resize();
                }, { once: true });
            }
        }
    });
</script>
</body>
</html>
