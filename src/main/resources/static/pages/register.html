<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 简历智能匹配系统</title>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body class="auth-page">
<div id="app">
    <div class="auth-card">
        <h1>创建账号</h1>
        <p class="auth-desc">加入简历智能匹配系统</p>

        <!--表单绑定与监听-->
        <form @submit.prevent="handleRegister">
            <div class="form-group">
                <label class="form-label">用户名 *</label>
                <input type="text" class="form-input" v-model="username" placeholder="4-20位字母或数字" required>
            </div>
            <div class="form-group">
                <label class="form-label">真实姓名</label>
                <input type="text" class="form-input" v-model="realName" placeholder="请输入真实姓名">
            </div>
            <div class="form-group">
                <label class="form-label">手机号</label>
                <input type="tel" class="form-input" v-model="phone" placeholder="请输入手机号">
            </div>
            <div class="form-group">
                <label class="form-label">邮箱</label>
                <input type="email" class="form-input" v-model="email" placeholder="请输入邮箱">
            </div>
            <div class="form-group">
                <label class="form-label">密码 *</label>
                <input type="password" class="form-input" v-model="password" placeholder="至少6位密码" required>
            </div>
            <div class="form-group">
                <label class="form-label">确认密码 *</label>
                <input type="password" class="form-input" v-model="confirmPassword" placeholder="再次输入密码" required>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary btn-block btn-lg" :disabled="loading">
                    {{ loading ? '注册中...' : '注册' }}
                </button>
            </div>
        </form>
        <div class="auth-link">
            已有账号？<a href="/pages/login.html">立即登录</a>
        </div>
    </div>
</div>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="/js/common.js"></script>
<script>
createVueApp({
    data() { return { username:'', realName:'', phone:'', email:'', password:'', confirmPassword:'', loading:false }; },
    mounted() { PageGuard.redirectIfAuth(); },
    methods: {
        async handleRegister() {
            if (!this.username) { Toast.warning('请输入用户名'); return; }
            if (this.username.length < 4) { Toast.warning('用户名至少4位'); return; }
            if (!this.password || this.password.length < 6) { Toast.warning('密码至少6位'); return; }
            if (this.password !== this.confirmPassword) { Toast.warning('两次密码不一致'); return; }
            this.loading = true;
            try {
                const res = await Api.post('auth/register', {
                    username:this.username, password:this.password,
                    realName:this.realName, phone:this.phone, email:this.email
                });
                if (res.code === 200) {
                    Toast.success('注册成功，请登录');
                    setTimeout(() => location.href='/pages/login.html', 1000);
                } else {
                    Toast.error(res.message || '注册失败');
                }
            } catch (e) {
                Toast.error('网络错误，请重试');
            } finally { this.loading = false; }
        }
    }
});
</script>
</body>
</html>
