<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 简历智能匹配系统</title>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body class="auth-page">
<div id="app">
    <div class="auth-card">
        <h1>简历智能匹配系统</h1>
        <p class="auth-desc">登录您的账号</p>
        <form @submit.prevent="handleLogin">
            <div class="form-group">
                <label class="form-label">用户名</label>
                <!--前端使用v-model绑定输入框，自动收集用户输入的账号密码-->
                <input type="text" class="form-input" v-model="username" placeholder="请输入用户名" required autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="form-input" v-model="password" placeholder="请输入密码" required autocomplete="current-password">
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary btn-block btn-lg" :disabled="loading">
                    {{ loading ? '登录中...' : '登录' }}
                </button>
            </div>
        </form>
        <div class="auth-link">
            还没有账号？<a href="/pages/register.html">立即注册</a>
        </div>
        <div style="text-align:center;margin-top:16px;font-size:12px;color:var(--text-muted)">
            测试账号：admin / admin123  或  zhangsan / 123456
        </div>
    </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="/js/common.js"></script> //引入，提供认证、请求、工具、布局等全局能力
<script>

    /*
    **关键细节**：
- `mounted()` 时先调用 `PageGuard.redirectIfAuth()`，已登录用户自动跳走
- 提交按钮通过 `:disabled="loading"` 防止重复提交
- 按钮文字动态切换：`{{ loading ? '登录中...' : '登录' }}`
- 登录成功后 token 和 user 信息分两步存储（token 用于请求认证，user 用于页面展示）
- 内置测试账号提示：`admin/admin123` 和 `zhangsan/123456`

     */

    createVueApp({
        data() {
            return {
                username: '',
                password: '',
                loading: false
            };
        },
        mounted() {
            PageGuard.redirectIfAuth();
        },
        methods: {
            async handleLogin() {
                if (!this.username || !this.password) {
                    Toast.warning('请输入用户名和密码');
                    return;
                }
                this.loading = true;
                try {
                    //点击登录，前端调用你封装好的请求方法，这就是Axios思想+Fetch封装
                    const res = await Api.post('auth/login', {
                        username: this.username,
                        password: this.password
                    });
                    if (res.code === 200) {
                        const userData = res.data;
                        const token = userData.token;
                        delete userData.token;
                        Auth.setAuth(token, userData);
                        Toast.success('登录成功');
                        setTimeout(() => {
                            location.href = userData.role === 1
                                ? '/pages/admin/dashboard.html'
                                : '/pages/user/job-list.html';
                        }, 500);
                    } else {
                        Toast.error(res.message || '登录失败');
                    }
                } catch (e) {
                    console.error(e);
                    Toast.error('网络异常或服务未启动，请重试');
                } finally {
                    this.loading = false;
                }
            }
        }
    });
</script>
</body>
</html>
